# Supabase CLI configuration for Zuno.
# Local development: `supabase start` / `supabase db reset` (applies migrations + seed.sql).
# Secrets are never stored here: values below use env(...) placeholders that the CLI
# reads from your shell or supabase/.env (see supabase/functions/.env.example).

project_id = "zuno"

[api]
enabled = true
port = 54321
# Only these schemas are exposed through the Data API. `private` is deliberately absent.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# LOCAL DEVELOPMENT ONLY - generated by scripts/generate-seed-sql.py from supabase/seed/zuno_seed.json.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "8MiB"

# Buckets are also created by migration 20261006001200 for hosted projects.
[storage.buckets.event-media]
public = true
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic", "image/webp"]

[storage.buckets.avatars]
public = false
file_size_limit = "3MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic", "image/webp"]

[auth]
enabled = true
site_url = "zuno://auth/callback"
additional_redirect_urls = [
  "zuno://auth/callback",
  "zuno://payments/return",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = true
# Comma-separated: the iOS bundle id (native Sign in with Apple) and the Services ID (web).
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.external.google]
enabled = true
# Comma-separated: iOS client id and web client id.
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Local-only secrets for `supabase functions serve`; production uses `supabase secrets set`.
[edge_runtime.secrets]
NIC_HMAC_KEY = "env(NIC_HMAC_KEY)"
NIC_HMAC_KEY_VERSION = "env(NIC_HMAC_KEY_VERSION)"
PAYHERE_MERCHANT_ID = "env(PAYHERE_MERCHANT_ID)"
PAYHERE_MERCHANT_SECRET = "env(PAYHERE_MERCHANT_SECRET)"
PAYHERE_MODE = "env(PAYHERE_MODE)"
ANTHROPIC_API_KEY = "env(ANTHROPIC_API_KEY)"
AI_MODEL = "env(AI_MODEL)"
APNS_KEY_P8 = "env(APNS_KEY_P8)"
APNS_KEY_ID = "env(APNS_KEY_ID)"
APNS_TEAM_ID = "env(APNS_TEAM_ID)"
APNS_TOPIC = "env(APNS_TOPIC)"
APNS_ENV = "env(APNS_ENV)"

[analytics]
enabled = true
port = 54327
backend = "postgres"

# --- Edge Functions -----------------------------------------------------------
# All functions share supabase/functions/deno.json as import map. Functions that
# receive end-user calls keep verify_jwt = true (the gateway rejects missing or
# invalid JWTs) AND re-validate the token with auth.getUser inside the function.

[functions.nic-digest]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/nic-digest/index.ts"

[functions.payhere-checkout]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/payhere-checkout/index.ts"

# PayHere server-to-server callback: no JWT; trust comes from md5sig verification.
[functions.payhere-notify]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/payhere-notify/index.ts"

# Browser redirect from PayHere: no JWT; informational redirect into the app only.
[functions.payhere-return]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/payhere-return/index.ts"

[functions.ai-organizer-copilot]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/ai-organizer-copilot/index.ts"

[functions.delete-account]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/delete-account/index.ts"

[functions.organizer-export]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/organizer-export/index.ts"

# Service-role only. The function compares the bearer token with
# SUPABASE_SERVICE_ROLE_KEY in constant time, so it also works with the new
# non-JWT secret API keys (which the gateway's JWT check would reject).
[functions.push-dispatch]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/push-dispatch/index.ts"
